name: Keep Streamlit app awake

# Pings the deployed app every 6 hours so Streamlit Community Cloud
# never sees > 7 days of inactivity (its auto-sleep threshold).
# Free for public repos. Unlimited GitHub Actions minutes.

on:
  schedule:
    - cron: "0 */6 * * *"     # 00:00, 06:00, 12:00, 18:00 UTC every day
  workflow_dispatch:           # also allow manual trigger from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Streamlit app
        env:
          APP_URL: https://team8-mis542-252-spam-detector.streamlit.app/
        run: |
          echo "Pinging $APP_URL at $(date -u +'%Y-%m-%d %H:%M UTC')"
          # Streamlit Cloud routes through a CDN that bounces redirects.
          # Send the request like a real browser, cap redirects to 5,
          # and don't fail the workflow on non-2xx — any HTTP response
          # from the edge already counts as activity.
          set +e
          HTTP_STATUS=$(curl -L \
            --max-redirs 5 \
            --max-time 60 \
            -s -o /dev/null \
            -A "Mozilla/5.0 (compatible; GitHubActions-KeepAlive/1.0)" \
            -w "%{http_code}" \
            "$APP_URL")
          CURL_EXIT=$?
          set -e
          echo "curl exit code: $CURL_EXIT"
          echo "HTTP status:    $HTTP_STATUS"
          # Treat any HTTP response (even 3xx/4xx) as a successful ping.
          # The workflow only fails if curl couldn't reach the server at all
          # AND no status was returned.
          if [ -n "$HTTP_STATUS" ] && [ "$HTTP_STATUS" != "000" ]; then
            echo "✓ Keep-alive ping successful — server is reachable."
            exit 0
          else
            echo "✗ Could not reach server."
            exit 1
          fi
