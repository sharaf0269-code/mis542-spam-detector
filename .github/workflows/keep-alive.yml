name: Keep Streamlit app awake

# Pings the deployed app every 6 hours so Streamlit Community Cloud
# never sees > 7 days of inactivity (its auto-sleep threshold).
# Free for public repos. Unlimited GitHub Actions minutes.

on:
  schedule:
    - cron: "0 */6 * * *"     # 00:00, 06:00, 12:00, 18:00 UTC every day
  workflow_dispatch:           # also allow manual trigger from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Streamlit app
        env:
          APP_URL: https://team8-mis542-252-spam-detector.streamlit.app/
        run: |
          echo "Pinging $APP_URL at $(date -u +'%Y-%m-%d %H:%M UTC')"
          # -L follow redirects, -s silent, --max-time 60s, accept any 2xx/3xx
          HTTP_STATUS=$(curl -L -s -o /dev/null -w "%{http_code}" --max-time 60 "$APP_URL")
          echo "Returned HTTP $HTTP_STATUS"
          # Streamlit Cloud returns 200 even for sleeping apps (with wake button),
          # so any 2xx/3xx counts as a successful keep-alive ping.
          if [[ "$HTTP_STATUS" =~ ^[23] ]]; then
            echo "✓ Keep-alive ping successful"
            exit 0
          else
            echo "✗ Unexpected status code"
            exit 1
          fi
